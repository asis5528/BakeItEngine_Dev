plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bakeit.questdemo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bakeit.questdemo'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '0.1'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildFeatures {
        // Exposes the OpenXR loader AAR (headers + .so) to CMake via
        // find_package(OpenXR CONFIG).
        prefab true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Khronos OpenXR loader for Android (works on Quest; finds the Meta
    // runtime through the standard Android OpenXR broker).
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.36'
}
