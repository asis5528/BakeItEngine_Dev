plugins {
    id 'com.android.application'
}

// Precompiled SPIR-V from the engine tree, packaged as APK assets. The app
// extracts them to internal storage at startup and chdir()s there, so the
// engine's relative "shaders/..." paths work unchanged. Run the desktop
// engine (or compile.bat) first so the .spv files exist.
def engineShaderDir = file("$rootDir/../Source/shaders")
def generatedAssetDir = file("$buildDir/bakeitAssets")

tasks.register('syncEngineShaders', Copy) {
    from(engineShaderDir) {
        include '**/*.spv'
    }
    into "$generatedAssetDir/shaders"
}
preBuild.dependsOn 'syncEngineShaders'

android {
    namespace 'com.bakeit.questdemo'
    compileSdk 34

    sourceSets {
        main {
            assets.srcDirs += generatedAssetDir
        }
    }

    defaultConfig {
        applicationId 'com.bakeit.questdemo'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '0.1'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildFeatures {
        // Exposes the OpenXR loader AAR (headers + .so) to CMake via
        // find_package(OpenXR CONFIG).
        prefab true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Khronos OpenXR loader for Android (works on Quest; finds the Meta
    // runtime through the standard Android OpenXR broker).
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.36'
}
